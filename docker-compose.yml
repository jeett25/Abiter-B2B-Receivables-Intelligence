services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: receivables-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receivables_ai
    ports:
      - "5433:5432"
    volumes:
      - receivables_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receivables_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  receivables_pg_data:
